name: Deploy Cloudflare (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-api:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-web:
    name: Deploy Web static assets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_STATIC_EXPORT: "1"
      - name: Apply standalone root
        run: node ../../scripts/apply-standalone.mjs
        env:
          NEXT_STATIC_EXPORT: "1"
      - name: Deploy Worker assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  configure-domain:
    name: Configure ccid custom domain
    runs-on: ubuntu-latest
    needs: deploy-web
    steps:
      - name: Configure ccid.mirai-dx-platform.com (DNS + Worker custom domain)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
          CCID_HOST: ccid.mirai-dx-platform.com
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          # 1) DNS AAAA (100::) を冪等に作成
          existing=$(curl -fsS "${API}/zones/${CF_ZONE_ID}/dns_records?type=AAAA&name=${CCID_HOST}" -H "$AUTH")
          if [ "$(echo "$existing" | jq -r '.result | length')" = "0" ]; then
            curl -fsS -X POST "${API}/zones/${CF_ZONE_ID}/dns_records" \
              -H "$AUTH" -H "Content-Type: application/json" \
              --data "{\"type\":\"AAAA\",\"name\":\"${CCID_HOST}\",\"content\":\"100::\",\"proxied\":true,\"comment\":\"cci-web-assets custom domain (CI)\"}" \
              >/dev/null
            echo "dns: AAAA ${CCID_HOST} -> 100:: created"
          else
            echo "dns: AAAA ${CCID_HOST} already exists"
          fi

          # 2) Worker カスタムドメインを冪等にアタッチ
          list=$(curl -fsS "${API}/accounts/${CF_ACCOUNT_ID}/workers/domains" -H "$AUTH")
          if [ "$(echo "$list" | jq -r "[.result[]? | select(.hostname == \"${CCID_HOST}\")] | length")" = "0" ]; then
            curl -fsS -X PUT "${API}/accounts/${CF_ACCOUNT_ID}/workers/domains" \
              -H "$AUTH" -H "Content-Type: application/json" \
              --data "{\"hostname\":\"${CCID_HOST}\",\"service\":\"cci-web-assets\",\"zone_id\":\"${CF_ZONE_ID}\"}" \
              >/dev/null
            echo "domain: ${CCID_HOST} attached to cci-web-assets"
          else
            echo "domain: ${CCID_HOST} already attached"
          fi
