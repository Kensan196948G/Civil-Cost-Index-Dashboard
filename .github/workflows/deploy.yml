name: Deploy Cloudflare (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-api:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-web:
    name: Deploy Web static assets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_STATIC_EXPORT: "1"
      - name: Apply standalone root
        run: node ../../scripts/apply-standalone.mjs
        env:
          NEXT_STATIC_EXPORT: "1"
      - name: Deploy Worker assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  configure-domain:
    name: Configure ccid custom domain
    runs-on: ubuntu-latest
    needs: deploy-web
    steps:
      - name: Ensure ccid custom domain (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
          CCID_HOST: ccid.mirai-dx-platform.com
        run: |
          set -uo pipefail
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          # DNS AAAA (100::) はカスタムドメインのアタッチ時に Cloudflare が自動作成するため直接操作しない。

          # Worker カスタムドメインを冪等に確認・アタッチ（一覧取得不可でも PUT を試行）
          list_code=$(curl -sS -o /tmp/cf_domains.json -w '%{http_code}' "${API}/accounts/${CF_ACCOUNT_ID}/workers/domains" -H "$AUTH" || true)
          if [ "$list_code" = "200" ] && jq -e --arg h "$CCID_HOST" '[.result[]? | select(.hostname == $h)] | length > 0' /tmp/cf_domains.json >/dev/null 2>&1; then
            echo "domain: ${CCID_HOST} already attached"
            exit 0
          fi

          echo "domain: attaching ${CCID_HOST} -> cci-web-assets"
          resp=$(curl -sS -w '\n%{http_code}' -X PUT "${API}/accounts/${CF_ACCOUNT_ID}/workers/domains" \
            -H "$AUTH" -H "Content-Type: application/json" \
            --data "{\"hostname\":\"${CCID_HOST}\",\"service\":\"cci-web-assets\",\"zone_id\":\"${CF_ZONE_ID}\"}" || true)
          code=$(printf '%s' "$resp" | tail -n1)
          if [ "$code" = "200" ]; then
            echo "domain: attached (idempotent PUT ok)"
          else
            echo "warning: attach returned HTTP ${code}（権限不足または既に設定済みの可能性。ダッシュボードで確認してください）"
          fi
