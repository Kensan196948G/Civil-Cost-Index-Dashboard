services:
  api:
    # Cloudflare Worker API (Hono + Neon PostgreSQL) - local dev via wrangler
    image: node:22-alpine
    working_dir: /app/apps/api
    command: sh -c "npm install --no-audit --no-fund && npx wrangler dev --port 8787 --ip 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8787}
    env_file:
      - ./apps/api/.dev.vars
    ports:
      - "8787:8787"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10

  web:
    # Next.js static-export frontend - local dev
    image: node:22-alpine
    working_dir: /app/apps/web
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8787}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_started

volumes: {}
